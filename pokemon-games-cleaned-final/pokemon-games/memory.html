<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Memory Game | Sheyla Norton</title>
    <meta
      name="description"
      content="Match all the Pokémon pairs in this browser memory game built with HTML, CSS, and JavaScript."
    />
    <meta name="theme-color" content="#303092" />
    <link rel="icon" href="images/favicon.png" type="image/png" />
    <link
      rel="preload"
      href="fonts/press-start-2p-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/manrope-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
      <h1>Pok&eacute;mon Memory</h1>
      <p class="tagline">Gotta Catch 'Em All!</p>
    </header>
    <main id="main" class="panel stack">
      <p class="status">
        <span class="chip"
          >Found <span id="result">0</span> of <span id="total">6</span></span
        >
        <span class="chip">Moves <span id="moves">0</span></span>
      </p>
      <div
        id="board"
        class="board"
        role="group"
        aria-label="Memory cards"
      ></div>
      <noscript><p>This game needs JavaScript to run.</p></noscript>
      <p id="message" class="message" role="status"></p>
      <div class="actions">
        <button type="button" id="restart" class="btn">New Game</button>
        <a class="btn btn--secondary" href="index.html">Back Home</a>
      </div>
    </main>
    <footer class="site-footer">
      <p>
        &copy; 2022&ndash;2026 Sheyla Norton &middot; Originally built for
        WDD330 at BYU&ndash;Idaho
      </p>
      <p>
        Unofficial fan project. Pok&eacute;mon and related names are trademarks
        of Nintendo, Game Freak, and Creatures Inc.
      </p>
    </footer>
    <script type="module" src="memory.js"></script>
  </body>
</html>
